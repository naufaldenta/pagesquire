name: Alpha checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, dom, zip, sodium, pdo_sqlite, sqlite3, opcache, fileinfo
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:next-build
      - run: npm run format:check
      - run: npm run build
      - run: npm run release:prepare
