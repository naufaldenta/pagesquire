name: Publish npm packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, dom, zip, sodium
          coverage: none
          tools: composer:v2
      - name: Tag must match the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npm run release:check
      # Dependencies first, so no published package points at a missing version.
      # npm requires an explicit dist-tag for prereleases: alpha or beta.
      # Versions already on npm are skipped, so a failed run can be retried.
      - run: |
          version=$(node -p "require('./package.json').version")
          tag=$(node -p "require('./package.json').version.match(/-(alpha|beta)\./)[1]")
          for name in protocol core client react server cli; do
            if [ "$(npm view "@pagesquire/$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "@pagesquire/$name@$version is already published"
            else
              npm publish -w "packages/$name" --tag "$tag"
            fi
          done
